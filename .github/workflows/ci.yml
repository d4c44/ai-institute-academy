name: CI

on:
  pull_request:
  push:
    branches-ignore: [main] # main is checked by the Deploy workflow, which runs these jobs too

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go test ./...
      # The static (Pages) site ships a copy of the seed courses, translations included; it must not drift.
      - name: Static content is up to date
        run: |
          go run ./cmd/seed dump ../src/static/content.json
          git diff --exit-code -- ../src/static/content.json

  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - name: Static (Pages) build
        run: npm run build:static
        env:
          PAGES_BASE_PATH: /ai-institute-academy
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
