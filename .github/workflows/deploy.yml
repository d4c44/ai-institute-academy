name: Deploy

# On every push to main: run the checks, build both Docker images and push them to GHCR.
# If a server is configured (repository variable DEPLOY_HOST, see docs/DEPLOY.md) the new images
# are then rolled out to it over SSH. Without DEPLOY_HOST the last job is skipped.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Backend
        working-directory: backend
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
          go vet ./...
          go test ./...
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Frontend
        run: |
          npm ci
          npm run typecheck
          npm run lint

  images:
    name: Build and push images
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io/${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: API image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: |
            ${{ env.REGISTRY }}-api:${{ github.sha }}
            ${{ env.REGISTRY }}-api:latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - name: Web image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}-web:${{ github.sha }}
            ${{ env.REGISTRY }}-web:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  deploy:
    name: Deploy to server
    needs: images
    if: ${{ vars.DEPLOY_HOST != '' }}
    runs-on: ubuntu-latest
    environment: production
    env:
      HOST: ${{ vars.DEPLOY_HOST }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER || 'deploy' }}
      DIR: /opt/ai-academy
    steps:
      - uses: actions/checkout@v4
      - name: SSH setup
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf 'Host target\n  HostName %s\n  User %s\n  IdentityFile ~/.ssh/id_deploy\n  StrictHostKeyChecking yes\n' \
            "$HOST" "$DEPLOY_USER" > ~/.ssh/config
      - name: Copy stack files
        run: |
          scp deploy/docker-compose.yml deploy/Caddyfile deploy/backup.sh target:$DIR/
          ssh target "chmod +x $DIR/backup.sh"
      - name: Roll out
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
          SHA: ${{ github.sha }}
        run: |
          # The token is valid for this run only; it is piped over SSH, never written to a file here.
          printf '%s' "$GHCR_TOKEN" | ssh target "docker login ghcr.io -u '$ACTOR' --password-stdin"
          ssh target "cd $DIR \
            && sed -i '/^TAG=/d' .env && echo 'TAG=$SHA' >> .env \
            && docker compose pull \
            && docker compose up -d --remove-orphans \
            && docker image prune -f"
      - name: Wait for the site
        run: |
          # Asked from inside the web container, so it works whether Caddy serves HTTP or HTTPS.
          probe="Promise.all([fetch('http://127.0.0.1:3000/api/health'),fetch('http://api:8080/healthz')]).then(r=>process.exit(r.every(x=>x.ok)?0:1)).catch(()=>process.exit(1))"
          for i in $(seq 1 30); do
            if ssh target "cd $DIR && docker compose exec -T web node -e \"$probe\""; then
              echo "site is up"; exit 0
            fi
            sleep 5
          done
          echo "site did not come up" >&2
          ssh target "cd $DIR && docker compose ps && docker compose logs --tail=50 api web" || true
          exit 1
